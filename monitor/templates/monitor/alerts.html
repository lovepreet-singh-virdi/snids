{% extends "monitor/base.html" %}
{% block content %}
<h4>Alerts</h4>
<table class="table table-striped table-sm">
  <tr><th>Time</th><th>Type</th><th>Severity</th><th>Src</th><th>Dst</th><th></th></tr>
  {% for a in alerts %}
  <tr>
    <td>{{ a.created_at }}</td><td>{{ a.alert_type }}</td>
    <td><span class="badge bg-danger">{{ a.severity }}</span></td>
    <td>{{ a.src_ip }}</td><td>{{ a.dst_ip }}</td>
    <td><a href="/alerts/{{ a.id }}/" class="btn btn-sm btn-outline-primary">View</a></td>
  </tr>
  {% empty %}<tr><td colspan="6">No alerts</td></tr>{% endfor %}
</table>
{% endblock %}
