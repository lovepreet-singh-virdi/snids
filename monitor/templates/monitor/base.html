<!doctype html>
<html>
<head>
  <title>Smart Network Intrusion Detection System (SNIDS)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
  <style>
    body { background: #f5f7fb; color: #0f172a; }
    .navbar { background: linear-gradient(90deg,#111827,#1f2937); }
    .card { border: none; border-radius: 14px; box-shadow: 0 10px 28px rgba(15,23,42,0.12); }
    .glass { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px; }
    a, .nav-link { color: #e2e8f0; }
    a:hover, .nav-link:hover { color: #38bdf8; }
    .badge { text-transform: uppercase; letter-spacing: .05em; }
    footer { color: #6b7280; font-size: 0.92rem; }
    .hero { background: linear-gradient(120deg, rgba(56,189,248,0.12), rgba(167,139,250,0.12)); border-radius: 18px; }
    .section-title { letter-spacing: .06em; color: #6b7280; font-size: 0.95rem; text-transform: uppercase; }
    table { color: inherit; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center; font-weight: 700;
      color: #0f172a; background: #e0f2fe;
    }
    .snackbar-stack {
      position: fixed; bottom: 18px; right: 18px; z-index: 1080;
      display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
      pointer-events: none;
    }
    .snackbar {
      pointer-events: auto;
      min-width: 260px;
      background: #0f172a;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      font-size: 0.95rem;
      display: flex; align-items: center; gap: 10px;
      opacity: 0; transform: translateY(8px);
      transition: opacity .15s ease, transform .15s ease;
    }
    .snackbar.show { opacity: 0.98; transform: translateY(0); }
    .snackbar.success { background: #16a34a; }
    .snackbar.error { background: #dc2626; }
    .snackbar.info { background: #0ea5e9; }
  </style>
</head>
<body class="bg-light text-dark">
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">Smart Network IDS (SNIDS)</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample07">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarsExample07">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link" href="/alerts/">Alerts</a>
        <a class="nav-link" href="/traffic/">Traffic</a>
        <a class="nav-link" href="/monitoring/">Monitoring</a>
        <a class="nav-link" href="/monitoring/#sessions">Sessions</a>
        <a class="nav-link" href="/settings/">Settings</a>
        <a class="nav-link" href="/rules/">Rules</a>
        <a class="nav-link" href="/about/">About</a>
      </div>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<div class="snackbar-stack" id="snackbar-stack"></div>
<footer class="container pb-4 text-center">
  <div class="fw-semibold">Smart Network Intrusion Detection System (SNIDS)</div>
  <div class="text-muted">Django + Scapy - Lab use only - Capture requires admin/root or setcap/Npcap.</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/monitor/js/dashboard.js"></script>
<script>
// Auto-apply filters (alerts/traffic/session detail) with a small debounce
document.addEventListener('DOMContentLoaded', ()=>{
  document.querySelectorAll('.filter-form').forEach(form=>{
    const inputs = form.querySelectorAll('.filter-input');
    let t;
    const submitSoon = () => {
      clearTimeout(t);
      t = setTimeout(()=> form.requestSubmit(), 300);
    };
    inputs.forEach(el=>{
      el.addEventListener('change', submitSoon);
      if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'){
        el.addEventListener('input', submitSoon);
      }
    });
  });
});
</script>
</body>
</html>
